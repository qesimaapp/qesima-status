# Qesima uptime checks. The public page is our own index.html (served from this branch by GitHub Pages
# at status.qesima.com); Upptime only runs the checks and writes the data it reads (history/).
owner: qesimaapp
repo: qesima-status

# Slugs are keys the page uses for its names in both languages; change them there too.
sites:
  - name: Qesima Platform
    slug: platform
    url: https://qesima.com
  - name: Qesima API
    slug: qesima-api
    url: https://api.qesima.com/api/health
  - name: Application
    slug: application
    url: https://link.qesima.com/
  - name: Qesima Resources
    slug: resources
    url: https://assets.qesima.com/social/48/instagram.png

# A downtime issue is assigned to the owner, so GitHub emails it.
assignees:
  - qesimaapp

workflowSchedule:
  # owner's call (2026-11-11): every 20 minutes is enough at this stage
  uptime: "*/20 * * * *"
  # hourly, so today's bar on the page is at most an hour old
  summary: "0 * * * *"

# Upptime's own site still builds to the gh-pages branch, but Pages serves this branch, so it is unused.
status-website:
  cname: status.qesima.com
  name: Qesima Status
