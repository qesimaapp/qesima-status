  /* The website's palette (C:\dev\WEBSITE\src\styles\tokens.css), light and dark */
  :root {
    --bg: hsl(0 0% 97%);
    --surface: hsl(0 0% 100%);
    --line: hsl(0 1% 91%);
    --text: hsl(0 0% 11%);
    --muted: hsl(0 0% 37%);
    --soft: hsl(0 0% 50%);
    --brand: hsl(221 83% 53%);
    --logo: hsl(221 83% 53%);
    --hover: hsl(0 2% 91%);
    --empty: hsl(0 1% 86%);
    --ok: hsl(152 57% 38%);
    --ok-soft: hsl(152 50% 94%);
    --warn: hsl(36 92% 48%);
    --warn-soft: hsl(40 90% 93%);
    --bad: hsl(0 72% 51%);
    --bad-soft: hsl(0 80% 95%);
    --wait-soft: hsl(0 0% 93%);
    --shadow: 0 1px 2px hsl(0 0% 0% / 0.04), 0 8px 24px -12px hsl(0 0% 0% / 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: hsl(0 0% 3%);
      --surface: hsl(0 0% 11%);
      --line: hsl(0 0% 15%);
      --text: hsl(0 0% 97%);
      --muted: hsl(0 0% 63%);
      --soft: hsl(0 0% 50%);
      --logo: hsl(0 0% 100%);
      --hover: hsl(0 0% 13%);
      --empty: hsl(0 0% 20%);
      --ok: hsl(152 55% 45%);
      --ok-soft: hsl(152 45% 12%);
      --warn: hsl(38 92% 55%);
      --warn-soft: hsl(38 60% 12%);
      --bad: hsl(0 80% 62%);
      --bad-soft: hsl(0 55% 14%);
      --wait-soft: hsl(0 0% 13%);
      --shadow: 0 1px 2px hsl(0 0% 0% / 0.4), 0 8px 24px -12px hsl(0 0% 0% / 0.6);
    }
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--text); font-family: "Plex Arabic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { margin: 0; min-height: 100vh; font-size: 15px; line-height: 1.6; }
  h1, h2 { font-family: "Readex", "Plex Arabic", system-ui, sans-serif; margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 6px; }

  /* One container per language; the html data-lang decides which shows */
  html[data-lang="ar"] [data-lang="en"], html[data-lang="en"] [data-lang="ar"] { display: none; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 32px; }
  .logo { display: block; height: 26px; width: auto; fill: var(--logo); }
  .actions { display: flex; gap: 8px; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; line-height: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: 0.88; }

  .banner { border-radius: 14px; overflow: hidden; border: 1px solid var(--tone); background: var(--surface); box-shadow: var(--shadow); margin-bottom: 24px; }
  .banner .head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: var(--tone-soft); }
  .banner h1 { font-size: 18px; font-weight: 600; }
  .banner p { margin: 0; padding: 14px 20px; color: var(--muted); }
  .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--tone); display: grid; place-items: center; }
  .dot svg { width: 12px; height: 12px; stroke: var(--surface); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  [data-state="up"] { --tone: var(--ok); --tone-soft: var(--ok-soft); }
  [data-state="degraded"] { --tone: var(--warn); --tone-soft: var(--warn-soft); }
  [data-state="down"] { --tone: var(--bad); --tone-soft: var(--bad-soft); }
  [data-state="wait"] { --tone: var(--soft); --tone-soft: var(--wait-soft); }

  .card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
  .card > .title { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .card h2 { font-size: 17px; font-weight: 600; }
  .range { color: var(--soft); font-size: 13px; }
  .row { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .row .dot { width: 16px; height: 16px; }
  .row .dot svg { width: 10px; height: 10px; }
  .row .name { font-weight: 600; }
  .info { position: relative; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--soft); color: var(--soft); font-size: 10px; font-weight: 600; line-height: 1; cursor: help; }
  .info .tip { position: absolute; bottom: calc(100% + 8px); inset-inline-start: 50%; translate: -50% 0; width: max-content; max-width: 240px; padding: 6px 10px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 400; line-height: 1.4; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 2; }
  [dir="rtl"] .info .tip { translate: 50% 0; }
  .info:hover .tip, .info:focus .tip { opacity: 1; }
  .row .pct { margin-inline-start: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .bars { display: flex; gap: 2px; height: 30px; }
  .bar { flex: 1; min-width: 0; border-radius: 2px; background: var(--empty); }
  .bar.ok { background: var(--ok); }
  .bar.minor { background: var(--warn); }
  .bar.major { background: var(--bad); }
  .bar:hover { opacity: 0.7; }
  .scale { display: flex; justify-content: space-between; color: var(--soft); font-size: 12px; margin-top: 8px; }
  /* phones: the last 30 days only */
  .d30 { display: none; }
  @media (max-width: 600px) {
    .bar:nth-child(-n + 60) { display: none; }
    .d90 { display: none; }
    .d30 { display: inline; }
    .wrap { padding-top: 20px; }
    .actions .btn:not(.lang) { display: none; }
  }

  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 16px 4px 0; color: var(--soft); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  footer { margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--soft); font-size: 13px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }
</style>
</head>

    <div class="head"><span class="dot" data-icon></span><h1 data-title></h1></div>

    <div class="title"><h2>System status</h2><span class="range"><span class="d90">Last 90 days</span><span class="d30">Last 30 days</span></span></div>

    <span>We check every system every 20 minutes.</span>
    <a href="https://qesima.com/en">qesima.com</a>
  </footer>
</div>

<script>
  // Slugs match .upptimerc.yml. Data: history/summary.json (daily minutes down, hourly) and
  // history/<slug>.yml (current status, written by each check).
  var SITES = [
    { slug: "platform",
      ar: ["منصة قسيمه", "الموقع qesima.com"],
      en: ["Qesima Platform", "The website, qesima.com"] },
    { slug: "qesima-api",
      ar: ["واجهة قسيمه البرمجية", "تسجيل الدخول والبيانات والإشعارات في التطبيق"],
      en: ["Qesima API", "Sign-in, data and notifications in the app"] },
    { slug: "application",
      ar: ["التطبيق", "الروابط المشتركة التي تفتح التطبيق"],
      en: ["Application", "Shared links that open the app"] },
    { slug: "resources",
      ar: ["موارد قسيمه", "الصور والملفات"],
      en: ["Qesima Resources", "Images and files"] }
  ];
  var DAYS = 90;
  var MINOR_MAX = 60; // up to an hour down in a day reads as a short outage

  var COPY = {
    ar: {
      up: ["كل الأنظمة تعمل", "لا نعلم بأي مشكلة تؤثر على أنظمتنا."],
      degraded: ["بعض الأنظمة بطيئة", "نعمل على ذلك. قد تلاحظ بطئًا في بعض الخدمات."],
      down: ["بعض الأنظمة متوقفة", "نعمل على إعادتها. شكرًا لصبرك."],
      wait: ["جارٍ جمع البيانات", "بدأنا المراقبة للتو. تظهر النتائج بعد أول فحص."],
      none: "لا بيانات", ok: "بلا انقطاع", min: " دقيقة انقطاع", uptime: "% تشغيل",
      locale: "ar-u-nu-latn"
    },
    en: {
      up: ["We're fully operational", "We're not aware of any issues affecting our systems."],
      degraded: ["Some systems are slow", "We're on it. Some services may respond slowly."],
      down: ["Some systems are down", "We're working to restore them. Thanks for your patience."],
      wait: ["Collecting data", "Monitoring has just started. Results appear after the first check."],
      none: "No data", ok: "No downtime", min: " min down", uptime: "% uptime",
      locale: "en-GB"
    }
  };
  var ICONS = {
    up: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    degraded: '<svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></svg>',
    down: '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>',
    wait: '<svg viewBox="0 0 24 24"><path d="M7 12h.01M12 12h.01M17 12h.01"/></svg>'
  };

  // Language switch: show one container, hide the other. No routing, no reload.
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-set-lang]");
    if (!b) return;
    var l = b.getAttribute("data-set-lang"), h = document.documentElement;
    h.dataset.lang = l; h.lang = l; h.dir = l === "ar" ? "rtl" : "ltr";
    try { localStorage.setItem("status-lang", l); } catch (err) {}
    var other = document.querySelector('.wrap[data-lang="' + l + '"] [data-set-lang]');
    if (other) other.focus();
  });

  function day(d) { return d.toISOString().slice(0, 10); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function yml(text) {
    var o = {};
    text.split("\n").forEach(function (line) {
      var m = /^(\w+):\s*(.*)$/.exec(line);
      if (m) o[m[1]] = m[2].trim();
    });
    return o;
  }

  function get(url, type) {
    return fetch(url, { cache: "no-cache" })
      .then(function (r) { return r.ok ? r[type]() : null; })
      .catch(function () { return null; });
  }

  function render(summary, current) {
    var bySlug = {};
    (summary || []).forEach(function (s) { bySlug[s.slug] = s; });
    var today = new Date();
    var dates = [];
    for (var i = DAYS - 1; i >= 0; i--) dates.push(day(new Date(today.getTime() - i * 864e5)));

    var states = SITES.map(function (s) {
      var c = current[s.slug];
      return c && c.status ? c.status : (bySlug[s.slug] && bySlug[s.slug].status) || "wait";
    });
    var overall = states.indexOf("down") >= 0 ? "down"
      : states.indexOf("degraded") >= 0 ? "degraded"
      : states.every(function (x) { return x === "up"; }) ? "up" : "wait";

    ["ar", "en"].forEach(function (lang) {
      var t = COPY[lang], root = document.querySelector('.wrap[data-lang="' + lang + '"]');
      var banner = root.querySelector("[data-banner]");
      banner.dataset.state = overall;
      banner.querySelector("[data-icon]").innerHTML = ICONS[overall];
      banner.querySelector("[data-title]").textContent = t[overall][0];
      banner.querySelector("[data-text]").textContent = t[overall][1];
      var fmt = new Intl.DateTimeFormat(t.locale, { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });

      root.querySelector("[data-rows]").innerHTML = SITES.map(function (s, n) {
        var sum = bySlug[s.slug] || {}, cur = current[s.slug] || {};
        var down = sum.dailyMinutesDown || {};
        var start = (cur.startTime || "").slice(0, 10);
        var counted = 0, minutes = 0;
        var bars = dates.map(function (d) {
          var label = fmt.format(new Date(d + "T00:00:00Z")) + " · ";
          if (!start || d < start) return '<span class="bar" title="' + esc(label + t.none) + '"></span>';
          var m = down[d] || 0;
          counted++; minutes += m;
          var cls = m === 0 ? "ok" : m <= MINOR_MAX ? "minor" : "major";
          return '<span class="bar ' + cls + '" title="' + esc(label + (m ? m + t.min : t.ok)) + '"></span>';
        }).join("");
        var pct = counted ? (100 - (minutes / (counted * 1440)) * 100) : null;
        var pctText = pct === null ? t.none : (pct === 100 ? "100" : pct.toFixed(pct > 99.99 ? 3 : 2)) + t.uptime;
        return '<div class="row" data-state="' + states[n] + '">' +
          '<div class="top"><span class="dot">' + ICONS[states[n]] + '</span>' +
          '<span class="name">' + esc(s[lang][0]) + '</span>' +
          '<span class="info" tabindex="0" aria-label="' + esc(s[lang][1]) + '">i<span class="tip" role="tooltip">' + esc(s[lang][1]) + '</span></span>' +
          '<span class="pct">' + pctText + '</span></div>' +
          '<div class="bars" aria-hidden="true">' + bars + '</div></div>';
      }).join("");
    });
  }

  function load() {
    var current = {};
    Promise.all([get("history/summary.json", "json")].concat(SITES.map(function (s) {
      return get("history/" + s.slug + ".yml", "text").then(function (t) { if (t) current[s.slug] = yml(t); });
    }))).then(function (r) { render(r[0], current); });
  }

  render(null, {});
  load();
  // the data changes at most every 20 minutes; refresh while the page stays open
  setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
